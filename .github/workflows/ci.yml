name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run evaluation
        run: python -m claims_agent.eval --out reports/eval.md
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test-and-evaluate
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t insurance-claims-agent .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api insurance-claims-agent
          sleep 5
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/claims/assess -H "Content-Type: application/json" \
            -d '{"text": "On 2026-05-10 a stone cracked my windscreen. Policy AUTO-TN-100587. Quote: 640 TND.", "reported_on": "2026-05-11"}'
