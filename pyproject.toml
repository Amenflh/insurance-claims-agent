[project]
name = "insurance-claims-agent"
version = "0.1.0"
description = "Agentic insurance claim triage: extraction, hybrid retrieval over policy wordings, cited coverage decisions and human-review guardrails."
authors = [{ name = "Amen Allah FELAH" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["claims_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
